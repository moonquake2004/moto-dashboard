name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 看板为纯静态资源，无需构建；整理成 _site 后直接发布。
      # .nojekyll 一并带上，避免 GitHub Pages 用 Jekyll 处理而丢文件。
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r data assets _site/
          ls -lh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
