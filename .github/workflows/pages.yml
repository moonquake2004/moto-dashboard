name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:            # PR 只做校验，不部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false   # Pages 部署中途被取消可能留下半套产物

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4      # tools/check_specs.js 需要 node，否则会被跳过
        with: { node-version: 20 }

      - name: Validate data
        run: python build_data.py --check

      - name: Build static site
        run: |
          set -e
          python build_site.py --require-node
          test -f _site/index.html
          test -f _site/sitemap.xml
          test "$(ls _site/brand | wc -l)" -ge 40
          # 版本号现为内容哈希（十六进制），必须至少 1 位，否则说明注入失败
          grep -Eo 'data/dashboard\.js\?v=[0-9a-f]+' _site/index.html

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
