name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 发布前先跑一遍数据校验：缺 cc、价格解析不了、型号重名、来源缺失都会让构建失败
      - name: Validate data
        run: python3 build_data.py --check

      # 组装 _site：index.html（注入数据版本号）/ 仪表数据 / 官方 Logo /
      # 44 个独立品牌页 / sitemap.xml / robots.txt。
      # 原始调研 JSON（brands_*.json）、dashboard.json 和采集脚本不随站点公开。
      # 这一步原来是一段 shell，加品牌页之后收进 build_site.py，本地可复现：
      #   python3 build_site.py
      - name: Prepare static site
        run: |
          set -e
          python3 build_site.py
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -d _site/brand && test "$(ls _site/brand | wc -l)" -ge 40
          grep -o 'data/dashboard.js?v=[0-9]*' _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
